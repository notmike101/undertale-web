<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>Undertale Web</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css?v=diagnostics-overlay">
    <script type="module" src="app.js"></script>
</head>
<body>
    <main>
        <section id="launcher" aria-label="Launch Undertale">
            <button id="play-local">Play installed copy</button>
            <button id="import-folder">Import game folder</button>
            <input id="folder" type="file" webkitdirectory multiple hidden aria-label="Select Undertale installation folder">
            <details><summary>Restore save</summary><label>Browser save <input id="import-save" type="file" accept=".json,application/json"></label></details>
        </section>
        <div id="status" role="status" aria-live="polite"></div>
        <section id="player" hidden aria-label="Undertale game">
            <div class="game-frame">
                <div class="game-surface">
                    <canvas id="canvas" width="640" height="480" tabindex="0" aria-label="Undertale. Arrow keys to move, Z or Enter to confirm, X to cancel, C for menu."></canvas>
                    <p id="controller-status" role="status">Websocket controller connecting…</p>
                    <details id="game-menu">
                        <summary aria-label="Game controls">☰</summary>
                        <div class="menu-panel">
                            <button id="pause">Pause</button>
                            <button id="fullscreen">Fullscreen</button>
                            <button id="export-save">Export save</button>
                            <button id="restart">Restart</button>
                            <span id="save-status">Browser saves ready</span>
                        </div>
                    </details>
                </div>
            </div>
        </section>
        <details id="diagnostics">
            <summary>UNDERTALE / diagnostics</summary>
            <div class="diagnostics-panel">
                <pre id="log" aria-label="Runtime log" tabindex="0"></pre>
                <div class="diagnostics-links"><a href="runtime/LICENSE">AGPL license</a> · <a href="runtime/butterscotch-source.zip">Runtime source</a></div>
            </div>
        </details>
    </main>
</body>
</html>
