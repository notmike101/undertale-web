name: Enforce issue report format

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-format-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check validator behavior
        run: python3 tests/test_issue_report.py
      - name: Enforce required format
        run: python3 tools/check_issue_report.py
        env:
          GH_TOKEN: ${{ github.token }}
